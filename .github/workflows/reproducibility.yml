name: Reproducibility

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  tensorflow:
    name: TensorFlow Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install TensorFlow dependencies
        run: python -m pip install -r tensorflow_demo/requirements.txt

      - name: Verify TensorFlow
        run: |
          python -c "import tensorflow as tf; print('TensorFlow:', tf.__version__)"
          python -c "import flask; print('Flask:', flask.__version__ if hasattr(flask, '__version__') else 'installed')"

      - name: Check dependency consistency
        run: python -m pip check


  pytorch:
    name: PyTorch Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install PyTorch dependencies
        run: python -m pip install -r pytorch_demo/requirements.txt

      - name: Verify PyTorch
        run: |
          python -c "import torch; print('PyTorch:', torch.__version__)"
          python -c "import torchvision; print('Torchvision:', torchvision.__version__)"
          python -c "import flask; print('Flask installed successfully')"

      - name: Check dependency consistency
        run: python -m pip check


  keras:
    name: Keras Environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Keras dependencies
        run: python -m pip install -r keras_demo/requirements.txt

      - name: Verify Keras
        run: |
          python -c "import keras; print('Keras:', keras.__version__)"
          python -c "import tensorflow as tf; print('TensorFlow backend:', tf.__version__)"
          python -c "import numpy as np; print('NumPy:', np.__version__)"
          python -c "import flask; print('Flask installed successfully')"

      - name: Check dependency consistency
        run: python -m pip check